{% extends "base.html" %}

{% block title %}Редактирование: {{ form.instance.title }}{% endblock %}

{% block content %}
    <p><a href="{% url 'detail_list' form.instance.id %}">← Назад к задаче</a></p>

    <div class="card">
        <h1>Редактирование задачи</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сохранить</button>
        </form>
    </div>
{% endblock %}
